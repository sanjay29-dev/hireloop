# Server Port
server.port=8080

# Database Configuration (MySQL)
# Default database name is 'hireloop'
# Replace username and password with your MySQL credentials, or supply them via environment variables
spring.datasource.url=jdbc:mysql://localhost:3306/hireloop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configuration (Max 10MB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom File Storage Directory
file.upload-dir=uploads

# JWT Secret & Expiration Configuration (for Phase 2+)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# Default Admin Seed Credentials
app.default-admin.name=System Administrator
app.default-admin.email=admin@hireloop.com
app.default-admin.password=Admin@123
    